<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bucket List</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="heartsBg"></div>
<div id="app">
  <div id="topbar"></div>
  <div id="nav"></div>

  <div class="page page-fade">
    <div class="bucket-progress"><div class="bucket-bar" id="bucketBar" style="width:0%"></div></div>
    <div id="bucketList"></div>
    <div class="section-title"><h3>Add something to our list</h3></div>
    <div class="edit-form editOnly hidden">
      <input type="text" id="newBucketText" placeholder="Something we want to do together">
      <button class="btn btn-sm" id="addBucketBtn">Add to list</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let content = null;
async function load(){ const res = await api('/api/content'); content = await res.json(); }
async function save(){ await api('/api/content', { method: 'POST', body: JSON.stringify(content) }); }

function renderBucket(){
  const el = document.getElementById('bucketList');
  el.innerHTML = '';
  const done = content.bucket.filter(b => b.done).length;
  const pct = content.bucket.length ? Math.round((done / content.bucket.length) * 100) : 0;
  document.getElementById('bucketBar').style.width = pct + '%';

  if(content.bucket.length === 0){
    el.innerHTML = '<div class="empty-note">No items yet. Add your first shared dream below.</div>';
    return;
  }
  content.bucket.forEach(b => {
    const row = document.createElement('div');
    row.className = 'bucket-item' + (b.done ? ' done' : '');
    row.innerHTML = '<div class="bucket-check' + (b.done ? ' done' : '') + '">' + (b.done ? '&#10003;' : '') + '</div><div class="txt">' + escapeHtml(b.text) + '</div>';
    row.querySelector('.bucket-check').onclick = async (e) => {
      b.done = !b.done;
      await save();
      if(b.done){
        const rect = e.target.getBoundingClientRect();
        burstHearts(rect.left, rect.top, 10);
      }
      renderBucket();
    };
    if(window.editMode){
      const del = document.createElement('button');
      del.className = 'del-btn'; del.textContent = 'remove'; del.style.position='static';
      del.onclick = async (e) => { e.stopPropagation(); content.bucket = content.bucket.filter(x => x.id !== b.id); await save(); renderBucket(); };
      row.appendChild(del);
    }
    el.appendChild(row);
  });
}

document.getElementById('addBucketBtn').addEventListener('click', async () => {
  const text = document.getElementById('newBucketText').value.trim();
  if(!text) return;
  content.bucket.push({ id: uid(), text, done: false });
  await save();
  document.getElementById('newBucketText').value = '';
  renderBucket();
});

if(requireAuthOrRedirect()){
  renderChrome('bucket');
  (async () => { await load(); renderBucket(); })();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reasons</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="heartsBg"></div>
<div id="app">
  <div id="topbar"></div>
  <div id="nav"></div>

  <div class="page page-fade">
    <div class="reason-card" id="reasonCard">Tap below to see a reason I love you</div>
    <button class="btn reveal-btn" id="revealReasonBtn">Show me a reason</button>
    <div class="reason-count" id="reasonCountText"></div>

    <div class="section-title"><h3>Add a reason</h3></div>
    <div class="edit-form editOnly hidden">
      <textarea id="newReason" placeholder="I love you because..."></textarea>
      <button class="btn btn-sm" id="addReasonBtn">Add reason</button>
    </div>
    <div class="section-title"><h3>All reasons</h3></div>
    <div id="reasonList"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let content = null;
async function load(){ const res = await api('/api/content'); content = await res.json(); }
async function save(){ await api('/api/content', { method: 'POST', body: JSON.stringify(content) }); }

function renderReasons(){
  document.getElementById('reasonCountText').textContent = content.reasons.length + ' reason' + (content.reasons.length === 1 ? '' : 's') + ' saved';
  const el = document.getElementById('reasonList');
  el.innerHTML = '';
  if(content.reasons.length === 0){
    el.innerHTML = '<div class="empty-note">No reasons yet. Add the first one above.</div>';
    return;
  }
  content.reasons.slice().reverse().forEach(r => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.textContent = r.text;
    if(window.editMode){
      const del = document.createElement('button');
      del.className = 'del-btn'; del.textContent = 'remove';
      del.onclick = async () => { content.reasons = content.reasons.filter(x => x.id !== r.id); await save(); renderReasons(); };
      div.appendChild(del);
    }
    el.appendChild(div);
  });
}

document.getElementById('revealReasonBtn').addEventListener('click', (e) => {
  const card = document.getElementById('reasonCard');
  if(content.reasons.length === 0){
    card.textContent = 'Add some reasons in edit mode first';
    return;
  }
  const pick = content.reasons[Math.floor(Math.random() * content.reasons.length)];
  card.textContent = pick.text;
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  const rect = e.target.getBoundingClientRect();
  burstHearts(rect.left, rect.top, 10);
});

document.getElementById('addReasonBtn').addEventListener('click', async () => {
  const text = document.getElementById('newReason').value.trim();
  if(!text) return;
  content.reasons.push({ id: uid(), text });
  await save();
  document.getElementById('newReason').value = '';
  renderReasons();
});

if(requireAuthOrRedirect()){
  renderChrome('reasons');
  (async () => { await load(); renderReasons(); })();
}
</script>
</body>
</html>
